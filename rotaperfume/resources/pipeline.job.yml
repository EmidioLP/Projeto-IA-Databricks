# Job rotaperfume_pipeline - cresce uma tarefa por entrega:
#
#   [x] prompt 1: raw_conferencia - confere que os 10 CSVs chegaram ao Volume bronze.raw
#   [x] prompt 2: bronze_ingestao - raw -> tabelas bronze (uma por arquivo)
#   [x] prompt 3: silver_*        - bronze -> silver: chaves conferidas, tipos corretos, contrato via CHECK
#   [x] prompt 4: gold_*, testes  - silver -> gold: dimensões, fato_vendas, marts por diretoria, e
#                                   9 testes de qualidade que derrubam o job se falharem
#   [x] prompt 5: dashboard       - dashboard AI/BI comercial versionado como recurso do bundle
#   [x] prompt 6: metricas/auditoria - views com nome de negócio + auditoria de metadado (raise_error
#                                   se faltar COMMENT) + Genie space como recurso do bundle
#
#   ciência de dados:
#   [x] prompt 1: ml_features      - gold.fato_vendas/silver.oportunidades/silver.visitas ->
#                                   gold.features_treino (com rótulo comprou_em_7d) e
#                                   gold.features_cliente (sem rótulo), sempre com corte
#                                   ponto-no-tempo via montar_features(referencia)
#   [x] prompt 2: ml_modelo        - treina HistGradientBoostingClassifier em gold.features_treino,
#                                   registra lakehouse_rotaperfume.gold.propensao_compra no UC com
#                                   alias @prod (só depois dos 3 gates passarem), e grava
#                                   gold.score_propensao/modelo_metricas/calibragem_holdout
#   [x] prompt 3: ml_fila          - gold.fila_semanal (200 clientes priorizados por vendedor, com
#                                   motivo e sugestão em português) + quatro funções SQL no UC que
#                                   um agente consulta (priorizar_carteira, contexto_cliente,
#                                   sugerir_produtos, checar_disponibilidade)
#
#   app e genie:
#   [x] prompt 1: gold_retorno_ligacao - gold.retorno_ligacao (CREATE TABLE IF NOT EXISTS: única
#                                   tabela do projeto cujo dado vem do time, não do pipeline) +
#                                   segundo Genie space ("Rota do Perfume - Direção")
#
# raw_conferencia -> bronze_ingestao: sequencial. As quatro tasks silver_*
# dependem só de bronze_ingestao e rodam em paralelo entre si. As tasks
# gold_* seguem em cadeia (dimensoes -> fato_vendas -> marts) e daí se
# ramificam em três cadeias paralelas: testes -> ml_features -> ml_modelo ->
# ml_fila (o treino não pode rodar em dado que ainda não passou nos testes de
# qualidade, mas não precisa esperar as views de negócio), metricas_de_negocio
# -> auditoria_de_metadado (a auditoria depende das views que
# metricas_de_negocio acabou de criar, não só de gold_marts - e também de
# gold_retorno_ligacao, para nunca rodar antes da tabela existir), e
# gold_retorno_ligacao (não depende de views de negócio nem de testes -
# nasce vazia e só precisa que o schema gold já exista).
resources:
  jobs:
    rotaperfume_pipeline:
      name: rotaperfume_pipeline
      tasks:
        - task_key: raw_conferencia
          notebook_task:
            notebook_path: ../src/raw/conferencia.py
            base_parameters:
              catalog: ${var.catalog}
        - task_key: bronze_ingestao
          depends_on:
            - task_key: raw_conferencia
          notebook_task:
            notebook_path: ../src/bronze/ingestao.py
            base_parameters:
              catalog: ${var.catalog}
        - task_key: silver_clientes
          depends_on:
            - task_key: bronze_ingestao
          sql_task:
            warehouse_id: ${var.warehouse_id}
            file:
              path: ../src/silver/01-clientes.sql
        - task_key: silver_pedidos
          depends_on:
            - task_key: bronze_ingestao
          sql_task:
            warehouse_id: ${var.warehouse_id}
            file:
              path: ../src/silver/02-pedidos.sql
        - task_key: silver_itens_e_produtos
          depends_on:
            - task_key: bronze_ingestao
          sql_task:
            warehouse_id: ${var.warehouse_id}
            file:
              path: ../src/silver/03-itens-e-produtos.sql
        - task_key: silver_crm_e_financeiro
          depends_on:
            - task_key: bronze_ingestao
          sql_task:
            warehouse_id: ${var.warehouse_id}
            file:
              path: ../src/silver/04-crm-e-financeiro.sql
        - task_key: gold_dimensoes
          depends_on:
            - task_key: silver_clientes
            - task_key: silver_pedidos
            - task_key: silver_itens_e_produtos
            - task_key: silver_crm_e_financeiro
          sql_task:
            warehouse_id: ${var.warehouse_id}
            file:
              path: ../src/gold/05-dimensoes.sql
        - task_key: gold_fato_vendas
          depends_on:
            - task_key: gold_dimensoes
          sql_task:
            warehouse_id: ${var.warehouse_id}
            file:
              path: ../src/gold/06-fato-vendas.sql
        - task_key: gold_marts
          depends_on:
            - task_key: gold_fato_vendas
          sql_task:
            warehouse_id: ${var.warehouse_id}
            file:
              path: ../src/gold/07-marts.sql
        - task_key: testes
          depends_on:
            - task_key: gold_marts
          sql_task:
            warehouse_id: ${var.warehouse_id}
            file:
              path: ../src/gold/08-testes.sql
        - task_key: ml_features
          depends_on:
            - task_key: testes
          notebook_task:
            notebook_path: ../src/ml/11-features.py
            base_parameters:
              catalog: ${var.catalog}
        - task_key: ml_modelo
          depends_on:
            - task_key: ml_features
          notebook_task:
            notebook_path: ../src/ml/12-modelo.py
            base_parameters:
              catalog: ${var.catalog}
        - task_key: ml_fila
          depends_on:
            - task_key: ml_modelo
          sql_task:
            warehouse_id: ${var.warehouse_id}
            file:
              path: ../src/ml/13-fila.sql
        - task_key: metricas_de_negocio
          depends_on:
            - task_key: gold_marts
          sql_task:
            warehouse_id: ${var.warehouse_id}
            file:
              path: ../src/gold/09-metricas-negocio.sql
        - task_key: gold_retorno_ligacao
          depends_on:
            - task_key: gold_marts
          sql_task:
            warehouse_id: ${var.warehouse_id}
            file:
              path: ../src/gold/14-retorno-ligacao.sql
        - task_key: auditoria_de_metadado
          depends_on:
            - task_key: metricas_de_negocio
            - task_key: gold_retorno_ligacao
          sql_task:
            warehouse_id: ${var.warehouse_id}
            file:
              path: ../src/gold/10-auditoria-metadado.sql
      schedule:
        quartz_cron_expression: "0 0 6 * * ?"
        timezone_id: America/Sao_Paulo
